name: Sync owner fork with upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: sync-owner-fork-main
  cancel-in-progress: false

jobs:
  merge-upstream:
    if: github.repository == 'joe-sama/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out fork main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: main

      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_URL: https://github.com/NousResearch/hermes-agent.git
          SYNC_BRANCH: bot/upstream-sync
        run: |
          set -euo pipefail

          git config user.name "joe-sama upstream sync"
          git config user.email "56972578+joe-sama@users.noreply.github.com"
          START_SHA=$(git rev-parse HEAD)
          git remote add upstream-sync "$UPSTREAM_URL"
          git fetch --no-tags upstream-sync main

          if git merge-base --is-ancestor upstream-sync/main HEAD; then
            echo "Fork main is already current with upstream."
            exit 0
          fi

          # Never guess through conflicts in an owner-customized fork. A clean
          # merge is validated below; a conflicting one is a successful safety
          # check that leaves main untouched and records why it was deferred.
          MERGE_BASE=$(git merge-base HEAD upstream-sync/main)
          mapfile -d '' WORKFLOW_CHANGED < <(
            git diff --name-only -z "$MERGE_BASE..upstream-sync/main" \
              -- .github/workflows
          )

          set +e
          git merge --no-commit --no-ff upstream-sync/main
          MERGE_STATUS=$?
          set -e

          if [ "$MERGE_STATUS" -ne 0 ]; then
            if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "::error::Upstream merge failed before producing a conflict report."
              exit "$MERGE_STATUS"
            fi
            mapfile -t UNMERGED < <(git diff --name-only --diff-filter=U)
            {
              echo "### Upstream update safely deferred"
              echo
              echo "Git found ${#UNMERGED[@]} owner/upstream conflicts."
              echo "Fork main was left unchanged; manual integration and validation are required."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Upstream update safely deferred::${#UNMERGED[@]} conflicts; fork main is unchanged."
            git merge --abort
            exit 0
          fi

          # GITHUB_TOKEN cannot push commits that alter workflow definitions.
          # Keep the fork's reviewed workflows during otherwise-clean syncs.
          for path in "${WORKFLOW_CHANGED[@]}"; do
            if git cat-file -e "$START_SHA:$path" 2>/dev/null; then
              git restore --source="$START_SHA" --staged --worktree -- "$path"
            else
              git rm -f --ignore-unmatch -- "$path" >/dev/null
            fi
          done

          git commit -m "Merge upstream main"
          MERGE_SHA=$(git rev-parse HEAD)

          {
            echo "### Upstream merge candidate"
            echo
            echo "Preserved ${#WORKFLOW_CHANGED[@]} reviewed workflow files."
            echo "Candidate: \`$MERGE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # Keep unvalidated merges away from main. This bot-only branch may be
          # rewritten by the next scheduled attempt after a conflict or failure.
          git push --force origin HEAD:"$SYNC_BRANCH"

          # GITHUB_TOKEN pushes intentionally do not trigger push workflows.
          # Explicit dispatch is the documented non-recursive route, and both
          # runs are filtered back to this exact merge SHA below.
          gh workflow run ci.yaml --ref "$SYNC_BRANCH"
          gh workflow run nix.yml --ref "$SYNC_BRANCH"

          find_run() {
            local workflow="$1"
            local run_id=""
            for i in $(seq 1 30); do
              if ! run_id=$(gh run list \
                --workflow "$workflow" \
                --branch "$SYNC_BRANCH" \
                --event workflow_dispatch \
                --commit "$MERGE_SHA" \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'); then
                echo "::warning::Could not list $workflow runs yet; retrying." >&2
                run_id=""
              fi
              if [ -n "$run_id" ]; then
                printf '%s' "$run_id"
                return 0
              fi
              sleep 2
            done
            echo "::error::Dispatched $workflow run was not found for $MERGE_SHA" >&2
            return 1
          }

          CI_RUN_ID=$(find_run ci.yaml)
          NIX_RUN_ID=$(find_run nix.yml)
          gh run watch "$CI_RUN_ID" --exit-status --interval 30 --compact
          gh run watch "$NIX_RUN_ID" --exit-status --interval 30 --compact

          # Promote exactly the merge that passed both runs. Ref leases make
          # this a compare-and-swap: if main or the bot branch moved, neither
          # ref changes and a later scheduled/manual run retries safely.
          git push --atomic \
            --force-with-lease="refs/heads/main:$START_SHA" \
            --force-with-lease="refs/heads/$SYNC_BRANCH:$MERGE_SHA" \
            origin HEAD:main ":refs/heads/$SYNC_BRANCH"
